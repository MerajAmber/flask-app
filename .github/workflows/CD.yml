name: CD

on:
    workflow_call:
jobs:
    Deploy:
        runs-on: ubuntu-latest
        steps:
            - name: ssh to prod server
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_KEY }}
                script: |
                    echo "Stating Deployment"
                    docker compose down
                    docker compose pull
                    sleep 5
                    docker compose up -d